name: iot-platform

# 离线部署覆盖层：固定应用运行镜像标签。
# 部署脚本仍会强制使用 --no-build --pull never。
services:
  postgres:
    image: iot-platform-postgres:17-pgvector-0.8.1

  platform-api:
    image: iot-platform-api:offline

  platform-web:
    image: iot-platform-web:offline

  deepseek-harness:
    image: iot-deepseek-harness:offline

  backup-service:
    image: iot-platform-backup:offline

  # 知识库向量计算与重排（模型已打包在镜像内）。
  embedding:
    image: iot-local-ai:offline

  reranker:
    image: iot-local-ai:offline

  # 可选摄像头直播媒体服务；仅在离线包包含视频组件且启用 profile "video" 时使用。
  zlmediakit:
    image: iot-zlmediakit:offline

  # Build from checksum-pinned official binaries; upstream registry pulls fail.
  minio:
    image: iot-platform-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./deploy/minio

  minio-dr:
    image: iot-platform-minio:RELEASE.2025-09-07T16-13-09Z
