name: iot-platform

# 离线部署覆盖层：固定应用运行镜像标签。
# 部署脚本仍会强制使用 --no-build --pull never。
services:
  platform-api:
    image: iot-platform-api:offline

  platform-web:
    image: iot-platform-web:offline

  deepseek-harness:
    image: iot-deepseek-harness:offline

  backup-service:
    image: iot-platform-backup:offline
