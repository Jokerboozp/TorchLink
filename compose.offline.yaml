name: iot-platform

# 离线部署覆盖层：固定运行镜像标签，并为 ThingsPanel 的 build-only 服务补充 image。
# 部署脚本仍会强制使用 --no-build --pull never。
services:
  platform-api:
    image: iot-platform-api:offline

  platform-web:
    image: iot-platform-web:offline

  gb26875-gateway:
    image: iot-platform-api:offline

  deepseek-harness:
    image: iot-deepseek-harness:offline

  backup-service:
    image: iot-platform-backup:offline

  backend:
    image: iot-thingspanel-backend:offline

  thingspanel:
    image: iot-thingspanel-web:offline
