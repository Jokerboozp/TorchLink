# Optional: cluster-up / cluster-render fills tool defaults as admin/admin123 and generates independent internal secrets.
# To choose values yourself, copy to a private location, replace every value, chmod 600. Never commit the real file.
# Passwords used inside connection URLs may contain only letters, digits and . _ ~ -
serviceAdminUser: admin
serviceAdminPassword: admin123
postgresPassword: admin123
postgresSuperuserPassword: change-me
postgresReplicationPassword: change-me
redisPassword: admin123
clickhousePassword: admin123
minioRootUser: admin
minioRootPassword: admin123
jwtSecret: change-me-at-least-32-characters-long
adminPassword: admin123
harnessToken: change-me-at-least-32-characters-long
emqxApiKey: change-me
emqxApiSecret: change-me
emqxCookie: change-me
emqxDashboardPassword: admin123
mqttToolUsername: admin
mqttToolPassword: admin123
# Public endpoint used by external MQTT subscribers; empty derives from the first broker node.
mqttPublicUrl: ""
# Tool/service Kafka credentials also configure the managed broker bootstrap user.
# SASL username/password must be provided together; mechanism defaults to SCRAM-SHA-256.
kafkaSaslUsername: admin
kafkaSaslPassword: admin123
kafkaSaslMechanism: ""
kafkaTls: "false"
# Keep the PEM CA beside this file (or in a subdirectory) and use a relative path for cluster-up.
# Direct cluster-render also accepts an absolute local path. Certificates only, no private key.
# Render copies and mounts it into every platform role and cluster-init. Requires kafkaTls: "true".
kafkaTlsCaFile: ""
# Empty Admin URL is derived from the first broker; an explicit URL uses the configured administrator.
kafkaAdminUrl: ""
kafkaAdminUsername: admin
kafkaAdminPassword: admin123
# Comma-separated external host:port addresses, matching the broker advertised listener.
kafkaPublicBrokers: ""
backupToken: change-me
# Optional: separate PostgreSQL database for backup restore checks (never the platform database)
backupRestoreTargetDSN: ""
backupRestoreMinioEndpoint: ""
backupRestoreMinioAccessKey: ""
backupRestoreMinioSecretKey: ""
deepseekApiKey: ""
# External Embedding API key, configured by the operator; optional until AI is used.
embeddingApiKey: ""
videoMediaSecret: change-me
videoHookSecret: change-me
videoCredentialKey: change-me
# Optional: PEM certificate and matching key for HTTPS (web 8443) and MQTTS/WSS
# (EMQX 8883/8084), relative to this file. Leave empty for plain entry points.
tlsCertFile: ""
tlsKeyFile: ""
# Optional: webhook (http/https) receiving Alertmanager notifications of the
# platform alert rules.
alertWebhookUrl: ""
