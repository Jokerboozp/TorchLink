{
  "version": "0.7.0",
  "kind": "app",
  "app": {
    "name": "炬联 IoT 工具 · 告警研判",
    "description": "Agent 专用受限数据工具，不包含模型。指定告警或最近活动告警的风险、原因、证据及人工处置建议",
    "icon": "🔥",
    "icon_type": "emoji",
    "icon_background": "#FFEAD5",
    "mode": "workflow",
    "use_icon_as_answer_icon": false
  },
  "dependencies": [],
  "workflow": {
    "environment_variables": [
      {
        "id": "iot-gateway-url",
        "name": "IOT_GATEWAY_URL",
        "value": "http://IOT_GATEWAY_HOST:8092",
        "value_type": "string",
        "description": "Dify 容器可访问的 IoT 接入服务地址",
        "selector": [
          "env",
          "IOT_GATEWAY_URL"
        ]
      },
      {
        "id": "iot-gateway-token",
        "name": "IOT_GATEWAY_TOKEN",
        "value": "",
        "value_type": "secret",
        "description": "当前 Agent 专用接入凭据，不进入模型提示",
        "selector": [
          "env",
          "IOT_GATEWAY_TOKEN"
        ]
      }
    ],
    "conversation_variables": [],
    "features": {
      "file_upload": {
        "enabled": false
      }
    },
    "graph": {
      "nodes": [
        {
          "id": "2100000000001",
          "type": "custom",
          "width": 260,
          "height": 100,
          "position": {
            "x": 80,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "start",
            "title": "工具输入",
            "selected": false,
            "variables": [
              {
                "variable": "question",
                "label": "question",
                "type": "paragraph",
                "required": true,
                "max_length": 32000,
                "options": []
              },
              {
                "variable": "plan",
                "label": "plan",
                "type": "paragraph",
                "required": true,
                "max_length": 24000,
                "options": []
              }
            ]
          }
        },
        {
          "id": "2100000000003",
          "type": "custom",
          "width": 260,
          "height": 100,
          "position": {
            "x": 400,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "http-request",
            "title": "读取平台事实与知识",
            "selected": false,
            "method": "post",
            "url": "{{#env.IOT_GATEWAY_URL#}}/v1/context/alarm-handler",
            "headers": "Content-Type:application/x-www-form-urlencoded\nAuthorization:Bearer {{#env.IOT_GATEWAY_TOKEN#}}",
            "params": "",
            "authorization": {
              "type": "no-auth",
              "config": null
            },
            "body": {
              "type": "x-www-form-urlencoded",
              "data": [
                {
                  "id": "question",
                  "key": "question",
                  "type": "text",
                  "value": "{{#2100000000001.question#}}"
                }
              ]
            },
            "timeout": {
              "connect": 10,
              "read": 120,
              "write": 10
            },
            "retry_config": {
              "retry_enabled": false,
              "max_retries": 0,
              "retry_interval": 1000
            },
            "ssl_verify": true
          }
        },
        {
          "id": "2100000000004",
          "type": "custom",
          "width": 260,
          "height": 100,
          "position": {
            "x": 720,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "if-else",
            "title": "检查查询成功",
            "selected": false,
            "cases": [
              {
                "case_id": "true",
                "logical_operator": "and",
                "conditions": [
                  {
                    "id": "2100000000004-ok",
                    "variable_selector": [
                      "2100000000003",
                      "status_code"
                    ],
                    "comparison_operator": "=",
                    "value": "200",
                    "varType": "number"
                  }
                ]
              }
            ]
          }
        },
        {
          "id": "2100000000007",
          "type": "custom",
          "width": 260,
          "height": 100,
          "position": {
            "x": 1040,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "http-request",
            "title": "执行授权工具",
            "selected": false,
            "method": "post",
            "url": "{{#env.IOT_GATEWAY_URL#}}/v1/tools/alarm-handler",
            "headers": "Content-Type:application/x-www-form-urlencoded\nAuthorization:Bearer {{#env.IOT_GATEWAY_TOKEN#}}",
            "params": "",
            "authorization": {
              "type": "no-auth",
              "config": null
            },
            "body": {
              "type": "x-www-form-urlencoded",
              "data": [
                {
                  "id": "question",
                  "key": "question",
                  "type": "text",
                  "value": "{{#2100000000001.question#}}"
                },
                {
                  "id": "plan",
                  "key": "plan",
                  "type": "text",
                  "value": "{{#2100000000001.plan#}}"
                }
              ]
            },
            "timeout": {
              "connect": 10,
              "read": 120,
              "write": 10
            },
            "retry_config": {
              "retry_enabled": false,
              "max_retries": 0,
              "retry_interval": 1000
            },
            "ssl_verify": true
          }
        },
        {
          "id": "3100000000009",
          "type": "custom",
          "position": {
            "x": 1360,
            "y": 200
          },
          "data": {
            "type": "end",
            "title": "原始事实与执行结果",
            "outputs": [
              {
                "variable": "context",
                "value_selector": [
                  "2100000000003",
                  "body"
                ],
                "value_type": "string"
              },
              {
                "variable": "contextStatus",
                "value_selector": [
                  "2100000000003",
                  "status_code"
                ],
                "value_type": "number"
              },
              {
                "variable": "result",
                "value_selector": [
                  "2100000000007",
                  "body"
                ],
                "value_type": "string"
              },
              {
                "variable": "resultStatus",
                "value_selector": [
                  "2100000000007",
                  "status_code"
                ],
                "value_type": "number"
              }
            ]
          }
        },
        {
          "id": "3100000000010",
          "type": "custom",
          "position": {
            "x": 720,
            "y": 450
          },
          "data": {
            "type": "end",
            "title": "上下文失败",
            "outputs": [
              {
                "variable": "contextError",
                "value_selector": [
                  "2100000000003",
                  "body"
                ],
                "value_type": "string"
              },
              {
                "variable": "errorStatus",
                "value_selector": [
                  "2100000000003",
                  "status_code"
                ],
                "value_type": "number"
              }
            ]
          }
        }
      ],
      "edges": [
        {
          "id": "2100000000001-2100000000003",
          "source": "2100000000001",
