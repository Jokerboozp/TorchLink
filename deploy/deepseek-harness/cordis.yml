# IoT deployment overlay for the upstream `dsh --profile sdk-minimal` tree.
# This file is passed with `--patch`; the selected profile supplies the base
# plugins, while this overlay restores the sidecar's tenant/session policy.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
    streamIdleTimeoutMs: 300000

- insert:
    - id: llm-ollama
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          ollama:
            displayName: Ollama
            apiKeyEnv: IOT_HARNESS_OLLAMA_API_KEY
            api: openai-completions
            baseURL: !!js process.env.IOT_HARNESS_OLLAMA_BASE_URL ?? 'http://ollama:11434/v1'
            defaultContextWindow: !!js Number(process.env.IOT_HARNESS_CONTEXT_WINDOW ?? 8192)
            defaultMaxTokens: 2048
            models:
              - id: !!js process.env.IOT_HARNESS_MODEL ?? 'qwen3:1.7b'
                contextWindow: !!js Number(process.env.IOT_HARNESS_CONTEXT_WINDOW ?? 8192)
                maxTokens: 2048
                input: [text]
                reasoningEfforts: false
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsReasoningEffort: false
              maxTokensField: max_tokens

- id: sandbox
  disabled: true

- id: sandbox-policy
  disabled: true

- id: subprocess
  disabled: true

- id: pty
  disabled: true

- id: terminal-bash
  disabled: true

- id: terminal-pwsh
  disabled: true

- id: fs-local
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.IOT_OPS_PERSONA

- id: agent-loop
  config:
    maxParallelToolCalls: 3

- id: tools
  config:
    mode: native

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: str-replace-editor
  disabled: true

- id: sessions
  config:
    root: !!js process.env.IOT_HARNESS_SESSION_ROOT
    packChunks: true
    compression: none

- insert:
    - id: mcp-iot
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: iot
        transport: streamable-http
        url: !!js process.env.IOT_MCP_URL
        headers:
          X-IOT-Runtime-Key: !!js process.env.IOT_MCP_RUNTIME_KEY
        toolCallTimeoutMs: 60000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    - id: iot-ops-policy
      name: './iot-ops-plugin.mjs'
      config:
        allowedTools: !!js JSON.parse(process.env.IOT_ALLOWED_TOOLS_JSON ?? '[]')
