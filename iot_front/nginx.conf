# 执行当前脚本步骤。
server {
    # 执行当前脚本步骤。
    listen 8080;
    # 执行当前脚本步骤。
    server_name _;

    # 执行当前脚本步骤。
    root /usr/share/nginx/html;
    # 执行当前脚本步骤。
    index index.html;
    # 执行当前脚本步骤。
    charset utf-8;
    # 执行当前脚本步骤。
    client_max_body_size 12m;

    # 执行当前脚本步骤。
    add_header X-Content-Type-Options "nosniff" always;
    # 执行当前脚本步骤。
    add_header X-Frame-Options "DENY" always;
    # 执行当前脚本步骤。
    add_header Referrer-Policy "no-referrer" always;
    # 执行当前脚本步骤。
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; media-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:" always;

    # 执行当前脚本步骤。
    location = /api/v1/ai/chat/stream {
        # 执行当前脚本步骤。
        proxy_pass http://platform-api:8080;
        # 执行当前脚本步骤。
        proxy_http_version 1.1;
        # 执行当前脚本步骤。
        proxy_buffering off;
        # 执行当前脚本步骤。
        proxy_request_buffering off;
        # 执行当前脚本步骤。
        proxy_cache off;
        # 执行当前脚本步骤。
        gzip off;
        # 执行当前脚本步骤。
        proxy_read_timeout 3600s;
        # 执行当前脚本步骤。
        proxy_send_timeout 3600s;
        # 执行当前脚本步骤。
        proxy_set_header Connection "";
        # 执行当前脚本步骤。
        proxy_set_header Host $host;
        # 执行当前脚本步骤。
        proxy_set_header X-Real-IP $remote_addr;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 执行当前脚本步骤。
        add_header X-Accel-Buffering "no" always;
    # 结束当前控制块。
    }

    # 运维中心实时日志使用 SSE，服务端每 15 秒发送心跳，单次连接最长 10 分钟。
    location = /api/v1/ops/logs/tail {
        proxy_pass http://platform-api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering "no" always;
    }

    # Match the collection and its children without nginx's implicit slash redirect.
    # Normalize previously cached redirects without changing the method or query.
    # Go source compilation plus sample execution can exceed the default 60s.
    # 执行当前脚本步骤。
    location ~ ^/api/v2/protocols(/|$) {
        # 执行当前脚本步骤。
        rewrite ^/api/v2/protocols/$ /api/v2/protocols break;
        # 执行当前脚本步骤。
        client_max_body_size 65m;
        # 执行当前脚本步骤。
        proxy_pass http://platform-api:8080;
        # 执行当前脚本步骤。
        proxy_http_version 1.1;
        # 执行当前脚本步骤。
        proxy_read_timeout 240s;
        # 执行当前脚本步骤。
        proxy_set_header Host $host;
        # 执行当前脚本步骤。
        proxy_set_header X-Real-IP $remote_addr;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-Proto $scheme;
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location /api/ {
        # 执行当前脚本步骤。
        proxy_pass http://platform-api:8080;
        # 执行当前脚本步骤。
        proxy_http_version 1.1;
        # 执行当前脚本步骤。
        proxy_set_header Host $host;
        # 执行当前脚本步骤。
        proxy_set_header X-Real-IP $remote_addr;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-Proto $scheme;
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location = /mcp {
        # 执行当前脚本步骤。
        proxy_pass http://platform-api:8080;
        # 执行当前脚本步骤。
        proxy_http_version 1.1;
        # 执行当前脚本步骤。
        proxy_buffering off;
        # 执行当前脚本步骤。
        proxy_cache off;
        # 执行当前脚本步骤。
        proxy_read_timeout 3600s;
        # 执行当前脚本步骤。
        proxy_set_header Connection "";
        # 执行当前脚本步骤。
        proxy_set_header Host $host;
        # 执行当前脚本步骤。
        proxy_set_header X-Real-IP $remote_addr;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-Proto $scheme;
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location /health/ {
        # 执行当前脚本步骤。
        proxy_pass http://platform-api:8080;
        # 执行当前脚本步骤。
        proxy_set_header Host $host;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 执行当前脚本步骤。
        proxy_set_header X-Forwarded-Proto $scheme;
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location / {
        # 执行当前脚本步骤。
        try_files $uri $uri/ /index.html;
        # The shell and app.js use stable names. Always revalidate them after
        # a deployment so an operator does not keep an old workflow catalog
        # management implementation in the browser.
        # 执行当前脚本步骤。
        add_header Cache-Control "no-store";
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location = /index.html {
        # 执行当前脚本步骤。
        try_files $uri =404;
        # 执行当前脚本步骤。
        add_header Cache-Control "no-store";
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location = /app.js {
        # 执行当前脚本步骤。
        try_files $uri =404;
        # 执行当前脚本步骤。
        add_header Cache-Control "no-store";
    # 结束当前控制块。
    }

    # 执行当前脚本步骤。
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        # 执行当前脚本步骤。
        try_files $uri =404;
        # 执行当前脚本步骤。
        expires 7d;
        # 执行当前脚本步骤。
        add_header Cache-Control "public, max-age=604800, immutable";
    # 结束当前控制块。
    }
# 结束当前控制块。
}
