# 只记录失败的请求：页面轮询和静态资源的成功请求不写访问日志，否则每次请求都会被采集进日志中心。
map $status $iot_access_loggable {
    ~^[23] 0;
    default 1;
}

include /etc/nginx/torchlink/maps.conf;

server {
    include /etc/nginx/torchlink/listen.conf;
    server_name _;
    include /etc/nginx/torchlink/redirect.conf;
    access_log /var/log/nginx/access.log combined if=$iot_access_loggable;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 12m;

    include /etc/nginx/snippets/torchlink-security.conf;

    location = /api/v1/ai/chat/stream {
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering "no" always;
        include /etc/nginx/snippets/torchlink-security.conf;
    }

    # 同步等待模型结果的 AI 接口：业务运行最长 4 分钟，另计等待 Harness 空位 2 分钟。
    location ~ ^/api/v1/ai/(chat|rule-draft|reports|protocol-assistant/generate|health-inspection|health-inspection/pdf)$ {
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 运维中心实时日志使用 SSE，服务端每 15 秒发送心跳，单次连接最长 10 分钟。
    location = /api/v1/ops/logs/tail {
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering "no" always;
        include /etc/nginx/snippets/torchlink-security.conf;
    }

    # Match the collection and its children without nginx's implicit slash redirect.
    # Normalize previously cached redirects without changing the method or query.
    # Go source compilation plus sample execution can exceed the default 60s.
    location ~ ^/api/v2/protocols(/|$) {
        rewrite ^/api/v2/protocols/$ /api/v2/protocols break;
        client_max_body_size 65m;
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 摄像头直播 HLS。每个播放列表和分片请求都先经 API 校验路径中的短期播放凭证，
    # 通过后才转发给媒体服务；凭证撤销后立即失效。媒体服务可选部署，使用运行时解析，
    # 未部署时只有本路径返回 502，前端和其他接口照常启动。
    location ~ "^/media/hls/(?<vtoken>[A-Za-z0-9]{32,128})/(?<vapp>src|tc)/(?<vstream>[A-Za-z0-9_]{1,64})/(?<vfile>[A-Za-z0-9_./-]+\.(m3u8|ts))$" {
        auth_request /__video_media_auth;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $video_media_upstream http://${IOT_VIDEO_UPSTREAM};
        proxy_pass $video_media_upstream/$vapp/$vstream/$vfile?vt=$vtoken;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/torchlink-security.conf;
    }

    # 普通前缀（不能用 ^~，否则会跳过上面的正则 location）：其余 /media/ 路径一律 404。
    location /media/ {
        return 404;
    }

    location = /__video_media_auth {
        internal;
        proxy_pass http://${IOT_API_UPSTREAM}/api/v1/video/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 对外只转发存活检查；/health/ready 含依赖明细，只在 API 端口与内网使用。
    location = /health/live {
        proxy_pass http://${IOT_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The shell and app.js use stable names. Always revalidate them after
        # a deployment so an operator does not keep an old workflow catalog
        # management implementation in the browser.
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/torchlink-security.conf;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/torchlink-security.conf;
    }

    location = /app.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/torchlink-security.conf;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/snippets/torchlink-security.conf;
    }
}
