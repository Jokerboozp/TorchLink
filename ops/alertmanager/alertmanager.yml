# 初始 Alertmanager 配置：部署时由 ops-init 写入共享卷（已存在则保留）。
# 接收人、渠道与路由之后由运维中心“监控告警 → 通知渠道”维护。
# Watchdog 是始终触发的告警链路心跳，发往无渠道的 torchlink-heartbeat，不通知任何人。
route:
  receiver: platform-null
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: torchlink-heartbeat
      matchers: ['alertname="Watchdog"']
      group_by: [alertname]
      repeat_interval: 24h
receivers:
  - name: platform-null
  - name: torchlink-heartbeat
