# 单机部署（compose.yaml）直接使用此文件，集群渲染通过 rules.go 嵌入同一份规则。
groups:
  - name: iot-platform
    rules:
      - alert: IotPlatformDown
        expr: up{job="iot-platform"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "IoT 平台不可用"}
      - alert: RawArchiveFailures
        expr: increase(raw_archive_failed_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "原始报文归档失败"}
      - alert: MQTTSubscriptionLost
        expr: (mqtt_subscription_count == 0) and (mqtt_ingress_enabled == 1)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "MQTT 平台接入订阅已中断"}
      - alert: MQTTBrokerObservationMissing
        expr: (mqtt_broker_observation_ok == 0) and (mqtt_ingress_enabled == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "MQTT Broker 管理观测不可用，无法判断消息丢弃"}
      - alert: MQTTDeliveryLoss
        expr: (delta(mqtt_broker_dropped[5m]) > 0) or (delta(mqtt_inbox_rejected[5m]) > 0) or (mqtt_inbox_corrupt > 0)
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "MQTT 消息出现丢弃、拒收或持久队列损坏"}
      - alert: MQTTInboxBacklog
        expr: mqtt_inbox_pending > 10000
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "MQTT 持久队列积压超过一万条"}
      - alert: ProtocolListenerFull
        expr: delta(protocol_listener_rejected_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "TCP/UDP 接入监听已满，新设备连接被拒绝，请调大 IOT_PROTOCOL_LISTENER_MAX_SESSIONS 或拆分接入网关"}
      - alert: ParseFailureRatioHigh
        expr: (sum(increase(parse_failed_total[10m])) / clamp_min(sum(increase(parse_failed_total[10m])) + sum(increase(parse_success_total[10m])), 1) > 0.05) and (sum(increase(parse_failed_total[10m])) > 20)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "解析失败超过 5%，请在原始报文中按解析状态筛选查看原因"}
      - alert: ParseFailingCompletely
        expr: (sum(increase(parse_failed_total[10m])) > 0) and (sum(increase(parse_success_total[10m])) == 0)
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "近 10 分钟收到的报文全部解析失败，请检查设备模板绑定的协议版本"}
      - alert: RawPublishFailures
        expr: increase(raw_publish_failed_total[10m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "原始报文已归档但写入内部消息队列失败，平台正在退避重试"}
      - alert: RawPublishStalled
        expr: max(raw_publish_stalled) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "有原始报文多次入队失败后已停止自动重试，需检查消息队列并回放"}
      - alert: IngestPaused
        expr: max(ingest_paused) == 1
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "处理积压超限，平台已暂停接收原始报文，设备上报被拒绝或丢帧重传"}
      - alert: ProtocolFramesDropped
        expr: increase(protocol_listener_dropped_frames_total[10m]) > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "TCP/UDP 接入因背压或存储故障持续丢帧，设备需重传"}
      - alert: ClickHouseInsertFailures
        expr: delta(clickhouse_insert_failed[10m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "ClickHouse 写入失败，遥测与原文可能缺失"}
      - alert: PostgresPoolSaturated
        expr: max by (instance) (postgres_pool_acquired_conns / postgres_pool_max_conns) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "实例 {{ $labels.instance }} 的数据库连接池占用超过 90%，请求会排队变慢"}
      - alert: PostgresReplicaReadsDisabled
        expr: min(postgres_replica_reads) == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "PostgreSQL 只读副本延迟过大或不可用，读请求已回到主库"}
      - alert: ReadinessDegraded
        expr: min by (instance, dependency) (readiness_ok) == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "实例 {{ $labels.instance }} 的依赖 {{ $labels.dependency }} 未就绪"}
      - alert: AIAnalysisFailures
        expr: increase(ai_analysis_failed_total[15m]) > 10
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "AI 分析失败量升高"}
      - alert: DeadLetterPublished
        expr: increase(dlq_published_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "设备消息处理失败并转入死信队列，需核对原因后回放"}
      - alert: ConsumerBlockedByOutage
        expr: max({__name__=~"consumer_blocked_seconds_.+"}) > 60
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "依赖故障导致设备消息暂停处理超过 1 分钟，恢复后自动继续"}
      - alert: KafkaLagObservationMissing
        expr: (min(kafka_lag_observation_ok) == 0) or (min(pipeline_backlog_observation_ok) == 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "无法读取消息队列积压，积压告警与接入背压可能失效"}
      - alert: KafkaConsumerLagHigh
        expr: kafka_lag > 10000
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "平台消息消费积压超过一万条"}
      - alert: AlarmNotificationFailures
        expr: increase(notification_failed_total[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "火警通知多次重试后仍发送失败，请检查通知渠道"}
      - alert: AlarmEventDeliveryFailures
        expr: increase(event_publish_failed_total[15m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "告警事件未能推送到消息总线或实时通道，页面实时提醒可能遗漏"}
      - alert: AuditWriteFailures
        expr: increase(audit_write_failed_total[15m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "审计记录写入失败，相关操作缺少审计"}
      - alert: RetentionFailures
        expr: increase(retention_failed_total[1d]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "历史数据清理失败，磁盘占用会持续增长"}
      - alert: PartitionMaintenanceFailures
        expr: increase(partition_maintenance_failed_total[1d]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "未能提前创建数据表月分区，新数据将进入默认分区"}
      - alert: HTTPServerErrorRatio
        expr: (sum by (job, instance) (rate(http_request_duration_seconds_count{code=~"5.."}[5m])) / sum by (job, instance) (rate(http_request_duration_seconds_count[5m])) > 0.05) and (sum by (job, instance) (rate(http_request_duration_seconds_count[5m])) > 0.1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "接口 5xx 错误超过 5%（{{ $labels.instance }}），按请求编号在日志中查看原因"}
      - alert: HTTPLatencyHigh
        expr: histogram_quantile(0.95, sum by (job, instance, le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "接口 95 分位耗时超过 2 秒（{{ $labels.instance }}）"}
      - alert: BackupFailures
        expr: increase(backup_failed_total[30m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "备份或恢复演练失败"}
      - alert: BackupStale
        expr: time() - max(backup_last_success_timestamp_seconds > 0) > 26 * 3600
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "超过 26 小时没有成功的备份，请检查备份服务是否运行"}
      - alert: RetentionStale
        expr: time() - max(retention_last_success_timestamp_seconds > 0) > 2 * 86400
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "超过 2 天没有成功的历史数据清理，请检查 jobs 进程"}
  - name: infrastructure
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "采集目标 {{ $labels.job }} / {{ $labels.instance }} 不可用"}
      - alert: HostDiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 90
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "主机根分区使用率超过 90%"}
      - alert: HostMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "主机可用内存不足 10%（{{ $labels.instance }}），容器可能被系统终止"}
      - alert: HostLoadHigh
        expr: node_load5{job="node"} / on (instance) count by (instance) (node_cpu_seconds_total{job="node",mode="idle"}) > 2
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "主机 5 分钟负载超过 CPU 核数的 2 倍（{{ $labels.instance }}）"}
      - alert: CoreComponentDown
        expr: up{job=~"redpanda|emqx|backup-service"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "核心组件 {{ $labels.job }} 不可抓取（{{ $labels.instance }}），设备接入、消息或备份可能中断"}
      - alert: RedpandaUnderReplicated
        expr: sum by (instance) (redpanda_kafka_under_replicated_replicas) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Redpanda 存在副本不足的分区（{{ $labels.instance }}），节点故障时可能丢失消息"}
