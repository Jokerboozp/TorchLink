# 与 compose.yaml 中的内联配置保持一致，供其他部署方式参考。
groups:
  - name: iot-platform
    rules:
      - alert: IotPlatformDown
        expr: up{job="iot-platform"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "IoT 平台不可用"}
      - alert: RawArchiveFailures
        expr: increase(raw_archive_failed_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "原始报文归档失败"}
      - alert: MQTTSubscriptionLost
        expr: (mqtt_subscription_count == 0) and (mqtt_ingress_enabled == 1)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "MQTT 平台接入订阅已中断"}
      - alert: MQTTBrokerObservationMissing
        expr: (mqtt_broker_observation_ok == 0) and (mqtt_ingress_enabled == 1)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "MQTT Broker 管理观测不可用，无法判断消息丢弃"}
      - alert: MQTTDeliveryLoss
        expr: (delta(mqtt_broker_dropped[5m]) > 0) or (delta(mqtt_inbox_rejected[5m]) > 0) or (mqtt_inbox_corrupt > 0)
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "MQTT 消息出现丢弃、拒收或持久队列损坏"}
      - alert: MQTTInboxBacklog
        expr: mqtt_inbox_pending > 10000
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "MQTT 持久队列积压超过一万条"}
      - alert: ProtocolListenerFull
        expr: delta(protocol_listener_rejected_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "TCP/UDP 接入监听已满，新设备连接被拒绝，请调大 IOT_PROTOCOL_LISTENER_MAX_SESSIONS 或拆分接入网关"}
      - alert: ParseFailureSpike
        expr: increase(parse_failed_total[5m]) > 100
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "解析失败量升高"}
      - alert: AIAnalysisFailures
        expr: increase(ai_analysis_failed_total[15m]) > 10
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "AI 分析失败量升高"}
      - alert: DeadLetterPublished
        expr: increase(dlq_published_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "设备消息处理失败并转入死信队列，需核对原因后回放"}
      - alert: ConsumerBlockedByOutage
        expr: max({__name__=~"consumer_blocked_seconds_.+"}) > 60
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "依赖故障导致设备消息暂停处理超过 1 分钟，恢复后自动继续"}
      - alert: KafkaConsumerLagHigh
        expr: kafka_lag > 10000
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "平台消息消费积压超过一万条"}
      - alert: AlarmNotificationFailures
        expr: increase(notification_failed_total[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "火警通知多次重试后仍发送失败，请检查通知渠道"}
      - alert: RetentionFailures
        expr: increase(retention_failed_total[1d]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "历史数据清理失败，磁盘占用会持续增长"}
      - alert: PartitionMaintenanceFailures
        expr: increase(partition_maintenance_failed_total[1d]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "未能提前创建数据表月分区，新数据将进入默认分区"}
      - alert: BackupFailures
        expr: increase(backup_failed_total[30m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "备份或恢复演练失败"}
  - name: infrastructure
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "采集目标 {{ $labels.job }} / {{ $labels.instance }} 不可用"}
      - alert: HostDiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 90
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "主机根分区使用率超过 90%"}
