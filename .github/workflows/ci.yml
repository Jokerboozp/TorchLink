name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # Same PostgreSQL major and pgvector version as deploy/postgres.
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: iot
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: iot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot -d iot" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.7-alpine
        env:
          CLICKHOUSE_USER: iot
          CLICKHOUSE_PASSWORD: ci-clickhouse-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IOT_TEST_POSTGRES_DSN: postgres://iot:ci-postgres-password@127.0.0.1:5432/iot?sslmode=disable
      IOT_TEST_CLICKHOUSE_URL: http://iot:ci-clickhouse-password@127.0.0.1:8123/
      IOT_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest 1.26 patch release, like the golang:1.26 build images, so
          # govulncheck sees the current standard library.
          go-version: "1.26"
      - name: 格式检查
        run: |
          unformatted="$(gofmt -l cmd internal deploy/toolaccounts)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./deploy/toolaccounts
      - name: 依赖清单整洁
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: golangci-lint（规则见 .golangci.yml）
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run ./cmd/... ./internal/... ./deploy/toolaccounts
      - name: 后端测试（真实 PostgreSQL / ClickHouse / Redis）
        run: |
          status=0
          go test -count=1 -json ./cmd/... ./internal/... ./deploy/toolaccounts > "$RUNNER_TEMP/go-test.json" || status=$?
          python3 scripts/ci/annotate-go-test.py "$RUNNER_TEMP/go-test.json"
          exit $status
      - name: 并发路径竞态检测
        run: go test -race -count=1 ./internal/core/... ./internal/protocolruntime/... ./internal/durablequeue/... ./internal/adapters/mqtt/... ./internal/adapters/kafka/... ./internal/externaldata/...
      - name: 独立协议 module 测试
        run: |
          for module in protocol-packages/gb26875-dahua dev/*/; do
            echo "::group::$module"
            (cd "$module" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done
      - name: 依赖漏洞检查
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          for module in protocol-packages/gb26875-dahua dev/*/; do (cd "$module" && govulncheck ./...); done

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: iot_front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iot_front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: 浏览器界面巡检（合成数据，桌面与手机视图）
        env:
          IOT_TEST_BROWSER: /usr/bin/google-chrome
          IOT_UI_SKIP_SCREENSHOTS: '1'
        run: |
          node tests/browser/ui-preview.mjs &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          node tests/browser/naive-pages-check.mjs
      - name: 依赖漏洞检查（提示，不阻断；npm 审计服务偶尔不可用）
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  deployment-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 部署脚本冒烟（模拟 Docker，真实 Compose 解析）
        run: |
          compose="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          test -x "$compose"
          echo "COMPOSE_EXE=$compose" >> "$GITHUB_ENV"
          bash scripts/tests/deployment-smoke.sh "$compose"
      - name: PowerShell 部署脚本冒烟
        shell: pwsh
        run: ./scripts/tests/deployment-smoke.ps1 -ComposeExe $env:COMPOSE_EXE
      - name: PowerShell 脚本语法检查
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in Get-ChildItem scripts -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { $failed++; Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($failed) { exit 1 }
      - name: Web 与备份镜像以非 root 启动
        run: |
          docker build -q -t torchlink-web-check iot_front
          docker run -d --name web-check -p 18080:8080 -e IOT_API_UPSTREAM=127.0.0.1:9 -e IOT_VIDEO_UPSTREAM=127.0.0.1:9 torchlink-web-check
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="app"'
          test "$(docker exec web-check id -u)" = 101
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health/ready)" = 404
          docker rm -f web-check
          # A staging volume from an earlier release belongs to root.
          docker build -q -t torchlink-backup-check -f deploy/backup/Dockerfile .
          docker volume create backup-check
          docker run --rm -v backup-check:/d alpine:3.22 sh -c 'mkdir -p /d/old && chown -R 0:0 /d'
          docker run -d --name backup-check -v backup-check:/app/data/backups -e IOT_BACKUP_DIR=/app/data/backups torchlink-backup-check
          sleep 3
          test "$(docker run --rm -v backup-check:/d alpine:3.22 stat -c %u /d/old)" = 65532
          if [ "$(docker inspect -f '{{.State.Running}}' backup-check)" = true ]; then
            docker top backup-check -o uid,cmd | grep backup-service | grep -q '^65532 '
          fi
          docker rm -f backup-check
      - name: 告警规则校验
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/prometheus:/r:ro" prom/prometheus:v3.5.0 check rules /r/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/ops/prometheus:/r:ro" prom/prometheus:v3.5.0 check config --syntax-only /r/prometheus.yml
