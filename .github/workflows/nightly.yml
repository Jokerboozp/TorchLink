name: 夜间集成测试

on:
  schedule:
    # 每天北京时间 02:17。
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # 耗时较长、未放进每次提交的竞态检测：HTTP 接口、容量测试和 PostgreSQL 仓储。
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: iot
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: iot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot -d iot" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.7-alpine
        env:
          CLICKHOUSE_USER: iot
          CLICKHOUSE_PASSWORD: ci-clickhouse-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IOT_TEST_POSTGRES_DSN: postgres://iot:ci-postgres-password@127.0.0.1:5432/iot?sslmode=disable
      IOT_TEST_CLICKHOUSE_URL: http://iot:ci-clickhouse-password@127.0.0.1:8123/
      IOT_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: 竞态检测（真实 PostgreSQL / ClickHouse / Redis）
        run: go test -race -count=1 -timeout 60m ./internal/httpapi/... ./internal/capacity/... ./internal/adapters/postgres/...

  # 真实 EMQX、Redpanda、Mosquitto 与协议运行器，见 scripts/ci/nightly-integration.sh。
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: iot
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: iot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot -d iot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IOT_TEST_POSTGRES_DSN: postgres://iot:ci-postgres-password@127.0.0.1:5432/iot?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: 中间件与协议运行器集成测试
        run: bash scripts/ci/nightly-integration.sh
