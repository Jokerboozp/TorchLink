name: Linux x86_64 离线部署包

# 正式 Release 由人工在 Actions 页面触发，不再随每次合并自动发布。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-bundle-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检查打包环境
        run: |
          test "$(uname -m)" = x86_64
          docker info > /dev/null
          docker compose version

      - name: 验证公开包凭据初始化
        run: |
          python3 scripts/tests/release-version-test.py
          python3 scripts/tests/public-bundle-test.py
          pwsh -NoProfile -File scripts/tests/public-bundle-test.ps1

      - name: 确定版本号
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          versions="$RUNNER_TEMP/release-versions.txt"
          # Include drafts and standalone tags so their versions are not reused.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$versions"
          gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name' >> "$versions"
          version="$(python3 scripts/next-release-version.py < "$versions")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          printf '本次部署包版本：%s\n' "$version"

      - name: 验证部署脚本和 Compose 配置
        run: |
          compose="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          test -x "$compose"
          bash scripts/tests/deployment-smoke.sh "$compose"
          pwsh -NoProfile -File scripts/tests/deployment-smoke.ps1 -ComposeExe "$compose"

      - name: 准备磁盘空间
        run: |
          # Only remove unused preinstalled SDKs on this disposable GitHub runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h . /var/lib/docker

      - name: 构建完整离线包
        # Public release archives are created after removing private credentials.
        run: bash scripts/package-offline.sh --output-dir offline-bundles --target-os generic --skip-bundle-archive

      - name: 验证 RustFS 运行与健康检查
        run: |
          export RUSTFS_ACCESS_KEY=ci-validation
          export RUSTFS_SECRET_KEY="$(openssl rand -hex 32)"
          trap 'docker rm -f rustfs-package-check > /dev/null 2>&1 || true' EXIT
          docker run -d --name rustfs-package-check \
            --env RUSTFS_ACCESS_KEY --env RUSTFS_SECRET_KEY \
            rustfs/rustfs:1.0.1
          for attempt in $(seq 1 30); do
            if docker exec rustfs-package-check curl -fsS http://127.0.0.1:9000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'RustFS readiness check failed' >&2
          exit 1

      - name: 准备公开下载与分卷校验
        id: bundle
        run: |
          bundles=(offline-bundles/iot-platform-offline-*)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          python3 scripts/prepare-public-bundle.py "$bundle"
          name="$RELEASE_VERSION"
          mv "$bundle" "offline-bundles/$name"
          mkdir -p offline-bundles/release
          # Stream compression to avoid a second full-sized tar on runner disk.
          tar -C offline-bundles -czf - "$name" |
            split -b 1900m -d -a 3 - "offline-bundles/release/$name.tar.gz.part-"
          cd offline-bundles/release
          sha256sum "$name".tar.gz.part-* > SHA256SUMS
          cp "../$name/manifest.json" manifest.json
          cat > DEPLOY.txt <<EOF
          下载本 Release 的全部 .part-* 分卷和 SHA256SUMS 到同一个目录。
          在 Linux 目标机器运行：
            sha256sum -c SHA256SUMS
            mkdir -p $name
            cat $name.tar.gz.part-* | tar -xz --strip-components=1 -C $name
            cd $name
            sudo bash scripts/deploy-offline.sh
          新安装管理员和工具账号默认 admin/admin123；应用数据库账号保留 iot，连接密码默认 admin123。
          首次部署在目标机独立生成 JWT、内部令牌和加密密钥，完整配置见 .env.offline。
          升级已有部署：启动前先复制原 .env.offline，保持原项目、数据卷和凭据。
          对话与知识向量计算需配置 DeepSeek 和外部 Embedding API 密钥并保持联网。
          通用包不含特定发行版 RPM/DEB；目标机需满足 docs/DEPLOYMENT.md 的系统依赖。
          EOF
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub 部署包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
        run: |
          tag="$RELEASE_VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '提交：`%s`\n\n' "$GITHUB_SHA"
            printf 'Linux x86_64 完整离线包，包含应用、依赖镜像、Docker 安装文件和完整 docs/ 指南。知识文档与向量保存在 PostgreSQL + pgvector。\n\n'
            printf '下载全部分卷、SHA256SUMS 和 DEPLOY.txt，按 DEPLOY.txt 校验、解压和部署。新安装管理员和工具账号默认 admin/admin123，应用数据库账号保留 iot，连接密码默认 admin123；JWT、内部令牌和加密密钥在目标机独立随机生成。升级前保留原 .env.offline。\n\n'
            printf '对话使用 DeepSeek API，向量计算使用外部 Embedding API，需分别配置密钥并保持联网。构建通过不代表目标服务器部署验收。\n'
          } > "$notes"
          gh release create "$tag" --target "$GITHUB_SHA" --draft \
            --title "$tag" --notes-file "$notes"
          gh release upload "$tag" offline-bundles/release/*
          gh release edit "$tag" --draft=false --prerelease=false --latest
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          printf '部署包已发布：[下载 %s](%s)\n' "$BUNDLE_NAME" "$url" >> "$GITHUB_STEP_SUMMARY"
