name: iot-platform-local

# Dependencies for host-side Go/Vite development. No platform-api/platform-web containers.
# scripts/setup-local.ps1 or scripts/setup-local.sh prepares .env.local and starts these services.
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [iot]

services:
  deepseek-harness:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:8091:8091"
    image: ${IOT_DEEPSEEK_HARNESS_IMAGE:-iot-deepseek-harness:local}
    build:
      context: .
      dockerfile: deploy/deepseek-harness/Dockerfile
    environment:
      IOT_HARNESS_HOST: 0.0.0.0
      IOT_HARNESS_PORT: "8091"
      IOT_HARNESS_GATEWAY_TOKEN: ${IOT_AI_HARNESS_TOKEN:?IOT_AI_HARNESS_TOKEN is generated by the setup and deploy scripts}
      IOT_HARNESS_SESSION_ROOT: /data/sessions
      IOT_HARNESS_HOME: /data/runtime-home
      IOT_HARNESS_WORKSPACE: /data/workspace
      IOT_HARNESS_PLUGIN_DIR: /data/plugins
      IOT_HARNESS_PLUGIN_SEED_DIR: /harness/examples/iot-ops-agent/plugins
      IOT_HARNESS_MCP_ALLOWED_ORIGINS: ${IOT_HARNESS_MCP_ALLOWED_ORIGINS:-http://host.docker.internal:8081}
      IOT_HARNESS_MAX_CONCURRENCY: ${IOT_HARNESS_MAX_CONCURRENCY:-2}
      IOT_HARNESS_MAX_CACHED_CONVERSATIONS: ${IOT_HARNESS_MAX_CACHED_CONVERSATIONS:-4}
      IOT_HARNESS_CONVERSATION_TTL_MS: ${IOT_HARNESS_CONVERSATION_TTL_MS:-600000}
      IOT_HARNESS_RUN_TIMEOUT_MS: ${IOT_HARNESS_RUN_TIMEOUT_MS:-300000}
      IOT_HARNESS_RPC_TIMEOUT_MS: ${IOT_HARNESS_RPC_TIMEOUT_MS:-240000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      IOT_HARNESS_PROVIDER: ${IOT_AI_HARNESS_PROVIDER:-deepseek-official}
      IOT_HARNESS_MODEL: ${IOT_AI_HARNESS_MODEL:-deepseek-flash}
    volumes: ["deepseek-harness-data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 知识库向量计算（18093）与重排（18094），源码 API 通过依赖机地址访问；见 compose.yaml。
  embedding:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18093:8080"
    image: ${IOT_LOCAL_AI_IMAGE:-iot-local-ai:local}
    build:
      context: ./deploy/local-ai
      args:
        HF_ENDPOINT: ${IOT_HF_ENDPOINT:-https://huggingface.co}
        LLAMA_CPP_IMAGE: ${IOT_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11382@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984}
    environment:
      LLAMA_ARG_MODEL: /models/bge-m3-Q8_0.gguf
      LLAMA_ARG_EMBEDDINGS: "true"
      LLAMA_ARG_POOLING: cls
      LLAMA_ARG_THREADS: ${IOT_LOCAL_AI_THREADS:--1}
    healthcheck: &local-ai-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  reranker:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18094:8080"
    image: ${IOT_LOCAL_AI_IMAGE:-iot-local-ai:local}
    build:
      context: ./deploy/local-ai
      args:
        HF_ENDPOINT: ${IOT_HF_ENDPOINT:-https://huggingface.co}
        LLAMA_CPP_IMAGE: ${IOT_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11382@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984}
    environment:
      LLAMA_ARG_MODEL: /models/bge-reranker-v2-m3-Q8_0.gguf
      LLAMA_ARG_RERANKING: "true"
      LLAMA_ARG_THREADS: ${IOT_LOCAL_AI_THREADS:--1}
    healthcheck: *local-ai-health

  postgres:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:15432:5432"
    image: ${IOT_POSTGRES_IMAGE:-iot-platform-postgres:17-pgvector-0.8.1}
    build:
      context: ./deploy/postgres
      args:
        ALPINE_MIRROR: ${IOT_ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    # Parallel queries and cumulative statistics use dynamic shared memory in
    # /dev/shm; Docker's 64 MB default fails queries with SQLSTATE 53100.
    shm_size: ${IOT_POSTGRES_SHM_SIZE:-1g}
    # Each API/gateway process keeps up to IOT_POSTGRES_MAX_CONNS (default 64).
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=300s", "-c", "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f"]
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes: ["postgres-data:/var/lib/postgresql/data", "postgres-wal:/wal-archive"]
    depends_on:
      postgres-wal-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-tool-admin:
    image: ${IOT_POSTGRES_IMAGE:-iot-platform-postgres:17-pgvector-0.8.1}
    restart: "no"
    entrypoint: ["/bin/sh", "/init/postgres.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: iot
      PGUSER: iot
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin123}
      SERVICE_ADMIN_USER: ${SERVICE_ADMIN_USER:-admin}
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-admin123}
    volumes: ["./deploy/toolaccounts/postgres.sh:/init/postgres.sh:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [iot]

  clickhouse-tool-admin:
    image: clickhouse/clickhouse-server:25.7-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/init/clickhouse.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: iot
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      SERVICE_ADMIN_USER: ${SERVICE_ADMIN_USER:-admin}
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-admin123}
    volumes: ["./deploy/toolaccounts/clickhouse.sh:/init/clickhouse.sh:ro"]
    depends_on:
      clickhouse: {condition: service_healthy}
    networks: [iot]

  postgres-wal-init:
    image: alpine:3.22
    restart: "no"
    command: ["/bin/sh", "-ec", "chown -R 70:70 /wal-archive && chmod 750 /wal-archive"]
    volumes: ["postgres-wal:/wal-archive"]
    networks: [iot]

  redis:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:16379:6379"
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-admin123}", "--user", "${SERVICE_ADMIN_USER:-admin}", "on", ">${SERVICE_ADMIN_PASSWORD:-admin123}", "~*", "&*", "+@all"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3 兼容对象存储 RustFS；宿主机端口与凭据变量沿用原 MinIO 的设置。
  rustfs:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19000:9000"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19002:9001"
    image: ${IOT_RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: :9001
    volumes: ["rustfs-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-dr:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19001:9000"
    image: ${IOT_RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_DR_ROOT_USER:-admin}
      RUSTFS_SECRET_KEY: ${MINIO_DR_ROOT_PASSWORD:-admin123}
      RUSTFS_ADDRESS: :9000
    volumes: ["rustfs-dr-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19092:19092"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19644:9644"
    image: redpandadata/redpanda:v25.2.11
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:19092", "--advertise-kafka-addr", "internal://redpanda:9092,external://${IOT_LOCAL_ADVERTISED_HOST:-127.0.0.1}:19092", "--set", "redpanda.enable_sasl=true", "--set", "redpanda.admin_api_require_auth=true", "--set", 'redpanda.superusers=["${IOT_KAFKA_ADMIN_USERNAME:-admin}"]']
    environment:
      RP_BOOTSTRAP_USER: "${IOT_KAFKA_ADMIN_USERNAME:-admin}:${IOT_KAFKA_ADMIN_PASSWORD:-admin123}:${IOT_KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}"
      RPK_USER: ${IOT_KAFKA_ADMIN_USERNAME:-admin}
      RPK_PASS: ${IOT_KAFKA_ADMIN_PASSWORD:-admin123}
      RPK_SASL_MECHANISM: ${IOT_KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  redpanda-init:
    image: redpandadata/redpanda:v25.2.11
    restart: "no"
    depends_on: {redpanda: {condition: service_healthy}}
    environment:
      RPK_USER: ${IOT_KAFKA_ADMIN_USERNAME:-admin}
      RPK_PASS: ${IOT_KAFKA_ADMIN_PASSWORD:-admin123}
      RPK_SASL_MECHANISM: ${IOT_KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in iot.raw.message iot.parse.failed iot.parsed.message iot.property.report iot.event.report iot.device.state iot.alarm.raised iot.alarm.reported iot.alarm.recovered iot.alarm.confirmed iot.alarm.ai-analysis iot.ui-action iot.replay.request iot.device.business iot.dlq.parser iot.dlq.processor iot.dlq.state iot.dlq.device-alarm-notifications; do
          # Describe succeeds only with a live authenticated broker. Existing
          # topics retain partitions, replicas and log data on repeated startup.
          if ! rpk -X brokers=redpanda:9092 topic describe "$$topic" >/dev/null 2>&1; then
            rpk -X brokers=redpanda:9092 topic create "$$topic" --partitions 12 --replicas 1
          fi
        done
    networks: [iot]

  clickhouse:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18123:8123"
    image: clickhouse/clickhouse-server:25.7-alpine
    environment:
      CLICKHOUSE_DB: iot
      CLICKHOUSE_USER: iot
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user iot --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15

  emqx:
    <<: *service-defaults
    # MQTT ingress is ready after Kafka topics and storage tool accounts exist.
    # A completion dependency also lets Compose --wait accept the init job's exit.
    depends_on:
      redpanda-init: {condition: service_completed_successfully}
      postgres-tool-admin: {condition: service_completed_successfully}
      clickhouse-tool-admin: {condition: service_completed_successfully}
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:1883:1883"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:8083:8083"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18083:18083"
    # One file descriptor per MQTT connection; the default 20480 crashes the
    # broker at about 20,000 devices (emfile). See docs/DEVELOPMENT.md.
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    image: emqx/emqx:5.8.8
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        jwt_secret_b64="$$(printf '%s' "$$IOT_JWT_SECRET" | base64 | tr -d '\n')"
        tool_user_json="$$(printf '%s' "$$IOT_MQTT_TOOL_USERNAME" | sed 's/\\/\\\\/g; s/"/\\"/g')"
        tool_password_json="$$(printf '%s' "$$IOT_MQTT_TOOL_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')"
        printf '[{"user_id":"%s","password":"%s","is_superuser":true}]\n' "$$tool_user_json" "$$tool_password_json" > /opt/emqx/etc/tool-users.json
        printf 'authentication = [{mechanism = password_based, backend = built_in_database, user_id_type = username, password_hash_algorithm = {name = sha256, salt_position = suffix}, bootstrap_file = "/opt/emqx/etc/tool-users.json", bootstrap_type = plain}, {mechanism = jwt, from = password, algorithm = "hmac-based", use_jwks = false, secret = "%s", secret_base64_encoded = true, acl_claim_name = "acl", verify_claims = [{name = "username", value = "$${username}"}], disconnect_after_expire = true}]\n' "$$jwt_secret_b64" > /opt/emqx/etc/base.hocon
        if [ -n "$$IOT_EMQX_API_KEY" ] && [ -n "$$IOT_EMQX_API_SECRET" ]; then
          printf '%s:%s:administrator\n' "$$IOT_EMQX_API_KEY" "$$IOT_EMQX_API_SECRET" > /opt/emqx/etc/platform-api-keys
          printf '\napi_key.bootstrap_file = "/opt/emqx/etc/platform-api-keys"\n' >> /opt/emqx/etc/base.hocon
        fi
        sed -i 's/{allow, all}\./{deny, all}./' /opt/emqx/etc/acl.conf
        exec /usr/bin/docker-entrypoint.sh /opt/emqx/bin/emqx foreground
    environment:
      EMQX_NODE__NAME: iot-emqx@127.0.0.1
      IOT_MQTT_TOOL_USERNAME: ${IOT_MQTT_TOOL_USERNAME:-admin}
      IOT_MQTT_TOOL_PASSWORD: ${IOT_MQTT_TOOL_PASSWORD:-admin123}
      IOT_EMQX_API_KEY: ${IOT_EMQX_API_KEY:-}
      IOT_EMQX_API_SECRET: ${IOT_EMQX_API_SECRET:-}
      # Optional Erlang JIT compatibility flags for x86 emulation; native hosts use defaults.
      ERL_FLAGS: ${IOT_EMQX_ERL_FLAGS:-}
      IOT_JWT_SECRET: ${IOT_JWT_SECRET:?IOT_JWT_SECRET must be set}
      EMQX_AUTHORIZATION__NO_MATCH: deny
      # The platform's persistent inbox session buffers deliveries here while it
      # catches up; at the default of 1000 the broker silently drops the rest
      # although devices already received PUBACK.
      EMQX_MQTT__MAX_MQUEUE_LEN: ${IOT_EMQX_MAX_MQUEUE_LEN:-100000}
      EMQX_MQTT__MAX_INFLIGHT: ${IOT_EMQX_MAX_INFLIGHT:-128}
      EMQX_AUTHORIZATION__DENY_ACTION: ignore
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-admin123}
    volumes: ["emqx-data:/opt/emqx/data", "emqx-log:/opt/emqx/log"]
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 15

  backup-service:
    <<: *service-defaults
    # 本地默认不启动备份容器；源码调试请在 VS Code 启动 backup-service。
    # 需要临时用容器运行时再显式加 --profile backup。
    profiles: [backup]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:8092:8090"
    restart: unless-stopped
    image: ${IOT_BACKUP_IMAGE:-iot-platform-backup:local}
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
      args:
        ALPINE_MIRROR: ${IOT_ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    environment:
      IOT_BACKUP_HTTP_ADDR: :8090
      IOT_BACKUP_DIR: /app/data/backups
      IOT_POSTGRES_DSN: postgres://iot:${POSTGRES_PASSWORD:-admin123}@postgres:5432/iot?sslmode=disable
      IOT_MINIO_ENDPOINT: rustfs:9000
      IOT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      IOT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      IOT_CLICKHOUSE_URL: http://iot:${CLICKHOUSE_PASSWORD:-admin123}@clickhouse:8123?database=iot
      IOT_BACKUP_ENABLED: ${IOT_BACKUP_ENABLED:-true}
      IOT_BACKUP_TIME: ${IOT_BACKUP_TIME:-00:05}
      IOT_BACKUP_TIMEZONE: ${IOT_BACKUP_TIMEZONE:-Asia/Shanghai}
      IOT_BACKUP_ADMIN_TOKEN: ${IOT_BACKUP_ADMIN_TOKEN:?IOT_BACKUP_ADMIN_TOKEN is generated by the setup and deploy scripts}
      IOT_BACKUP_RESTORE_TARGET_DSN: ${IOT_BACKUP_RESTORE_TARGET_DSN:-}
      IOT_BACKUP_HARNESS_DATA_DIR: /app/harness
      IOT_BACKUP_HARNESS_SNAPSHOT_URLS: http://deepseek-harness:8091/v1/backup/snapshot
      IOT_AI_HARNESS_TOKEN: ${IOT_AI_HARNESS_TOKEN:?IOT_AI_HARNESS_TOKEN is generated by the setup and deploy scripts}
      IOT_BACKUP_RESTORE_HARNESS_DIR: /app/data/backups/restored-harness
      IOT_BACKUP_RESTORE_MINIO_ENDPOINT: rustfs-dr:9000
      IOT_BACKUP_RESTORE_MINIO_ACCESS_KEY: ${MINIO_DR_ROOT_USER:-admin}
      IOT_BACKUP_RESTORE_MINIO_SECRET_KEY: ${MINIO_DR_ROOT_PASSWORD:-admin123}
    volumes:
      - backup-staging:/app/data/backups
      - deepseek-harness-data:/app/harness:ro
    depends_on:
      postgres: {condition: service_healthy}
      rustfs: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  # 运维中心依赖（可选）：scripts/setup-local 使用 --include-ops / -IncludeOps 启用 ops profile。
  # 源码模式的 API 在宿主机运行，规则与通知配置目录通过绑定挂载共享给组件。
  prometheus:
    <<: *service-defaults
    profiles: [ops]
    image: prom/prometheus:v3.5.0
    # Compose 不会因 configs 内联内容变化而重建容器；抓取目标写入标签，源码机地址变化时随之重建。
    labels:
      iot.prometheus.platform-targets: "${IOT_LOCAL_API_HOST:-host.docker.internal}:8081,${IOT_LOCAL_BACKUP_METRICS_TARGET:-host.docker.internal:8092}"
    # 抓取平台 /metrics 的令牌只放在环境变量里，启动时写入数据卷内的私有文件。
    entrypoint: ["/bin/sh", "-c", "umask 077 && printf '%s' \"$$IOT_METRICS_TOKEN\" > /prometheus/.metrics-token && exec /bin/prometheus \"$$@\"", "prometheus"]
    environment:
      IOT_METRICS_TOKEN: ${IOT_METRICS_TOKEN:-}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}", "--enable-feature=auto-reload-config", "--config.auto-reload-interval=5s"]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19090:9090"
    configs:
      - {source: prometheus-local, target: /etc/prometheus/prometheus.yml}
      - {source: prometheus-local-alerts, target: /etc/prometheus/alerts.yml}
    volumes: ["prometheus-data:/prometheus", "${IOT_LOCAL_OPS_DIR:-./data/ops}/prometheus-rules:/etc/prometheus/rules:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  loki:
    <<: *service-defaults
    profiles: [ops]
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:13100:3100"
    configs:
      - {source: loki-local, target: /etc/loki/local-config.yaml}
    volumes: ["loki-data:/loki", "${IOT_LOCAL_OPS_DIR:-./data/ops}/loki:/etc/loki/ops:ro"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    <<: *service-defaults
    profiles: [ops]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:13000:3000"
    configs:
      - {source: grafana-local-datasources, target: /etc/grafana/provisioning/datasources/iot.yml}
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  alertmanager:
    <<: *service-defaults
    profiles: [ops]
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/ops/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19093:9093"
    volumes: ["${IOT_LOCAL_OPS_DIR:-./data/ops}/alertmanager:/etc/alertmanager/ops:ro", "alertmanager-data:/alertmanager"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    <<: *service-defaults
    profiles: [ops]
    image: grafana/alloy:v1.20.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    configs:
      - {source: alloy-local, target: /etc/alloy/config.alloy}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro", "alloy-data:/var/lib/alloy/data"]
    depends_on:
      loki: {condition: service_started}
    # The image has no HTTP client; bash reads /-/ready over /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  node-exporter:
    <<: *service-defaults
    profiles: [ops]
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro"]

  # Optional camera live media server (profile "video"). The API on the host
  # reaches its HTTP API at 127.0.0.1:18580; browsers reach WebRTC media on
  # IOT_VIDEO_RTC_PORT (UDP/TCP) and HLS through the Vite dev proxy.
  zlmediakit:
    <<: *service-defaults
    profiles: [video]
    image: ${IOT_ZLMEDIAKIT_IMAGE:-iot-zlmediakit:local}
    build:
      context: deploy/zlmediakit
    environment:
      IOT_VIDEO_MEDIA_SECRET: ${IOT_VIDEO_MEDIA_SECRET:-}
      IOT_VIDEO_HOOK_SECRET: ${IOT_VIDEO_HOOK_SECRET:-}
      IOT_VIDEO_MEDIA_SERVER_ID: ${IOT_VIDEO_MEDIA_SERVER_ID:-torchlink-media-1}
      IOT_VIDEO_HOOK_BASE: http://${IOT_LOCAL_API_HOST:-host.docker.internal}:8081/api/v1/video/hooks
      IOT_VIDEO_RTC_PORT: ${IOT_VIDEO_RTC_PORT:-8000}
      IOT_VIDEO_RTC_EXTERN_IP: ${IOT_VIDEO_RTC_EXTERN_IP:-127.0.0.1}
      IOT_VIDEO_TRANSCODE_THREADS: ${IOT_VIDEO_TRANSCODE_THREADS:-2}
      IOT_VIDEO_RTP_PORT_MIN: ${IOT_VIDEO_RTP_PORT_MIN:-30000}
      IOT_VIDEO_RTP_PORT_MAX: ${IOT_VIDEO_RTP_PORT_MAX:-30063}
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18580:80"
      - "${IOT_VIDEO_RTC_BIND_ADDRESS:-${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}}:${IOT_VIDEO_RTC_PORT:-8000}:${IOT_VIDEO_RTC_PORT:-8000}/udp"
      - "${IOT_VIDEO_RTC_BIND_ADDRESS:-${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}}:${IOT_VIDEO_RTC_PORT:-8000}:${IOT_VIDEO_RTC_PORT:-8000}/tcp"
      # GB28181 RTP receive ports (UDP and TCP); like the other local ports they
      # open beyond loopback only with --dependency-host.
      - "${IOT_VIDEO_RTP_BIND_ADDRESS:-${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}}:${IOT_VIDEO_RTP_PORT_MIN:-30000}-${IOT_VIDEO_RTP_PORT_MAX:-30063}:${IOT_VIDEO_RTP_PORT_MIN:-30000}-${IOT_VIDEO_RTP_PORT_MAX:-30063}/udp"
      - "${IOT_VIDEO_RTP_BIND_ADDRESS:-${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}}:${IOT_VIDEO_RTP_PORT_MIN:-30000}-${IOT_VIDEO_RTP_PORT_MAX:-30063}:${IOT_VIDEO_RTP_PORT_MIN:-30000}-${IOT_VIDEO_RTP_PORT_MAX:-30063}/tcp"
    tmpfs: ["/opt/media/hls:size=256m"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    cpus: ${IOT_VIDEO_MEDIA_CPUS:-2}
    mem_limit: ${IOT_VIDEO_MEDIA_MEMORY:-1g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/index/api/version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  iot:
    driver: bridge

volumes:
  postgres-data: {}
  postgres-wal: {}
  redis-data: {}
  rustfs-data: {}
  rustfs-dr-data: {}
  redpanda-data: {}
  clickhouse-data: {}
  emqx-data: {}
  emqx-log: {}
  backup-staging: {}
  deepseek-harness-data: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
  alertmanager-data: {}
  alloy-data: {}

configs:
  prometheus-local:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/alerts.yml
        - /etc/prometheus/rules/*.yml
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]
      scrape_configs:
        - job_name: iot-platform
          metrics_path: /metrics
          authorization:
            credentials_file: /prometheus/.metrics-token
          static_configs:
            - targets: ["${IOT_LOCAL_API_HOST:-host.docker.internal}:8081"]
        - job_name: backup-service
          metrics_path: /metrics
          static_configs:
            - targets: ["${IOT_LOCAL_BACKUP_METRICS_TARGET:-host.docker.internal:8092}"]
        - job_name: redpanda
          metrics_path: /public_metrics
          static_configs:
            - targets: ["redpanda:9644"]
        - job_name: emqx
          metrics_path: /api/v5/prometheus/stats
          static_configs:
            - targets: ["emqx:18083"]
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: loki
          static_configs:
            - targets: ["loki:3100"]
        - job_name: alertmanager
          static_configs:
            - targets: ["alertmanager:9093"]
        - job_name: grafana
          static_configs:
            - targets: ["grafana:3000"]
        - job_name: alloy
          static_configs:
            - targets: ["alloy:12345"]
  prometheus-local-alerts:
    content: |
      groups:
        - name: heartbeat
          rules:
            - alert: Watchdog
              expr: vector(1)
              labels: {severity: none}
              annotations: {summary: "告警链路心跳，用于确认 Prometheus 到 Alertmanager 的告警链路正常"}
        - name: mqtt-capacity
          rules:
            - alert: MQTTSubscriptionLost
              expr: (mqtt_subscription_count == 0) and (mqtt_ingress_enabled == 1)
              for: 1m
              labels: {severity: critical}
              annotations: {summary: "MQTT 平台接入订阅已中断"}
            - alert: MQTTBrokerObservationMissing
              expr: (mqtt_broker_observation_ok == 0) and (mqtt_ingress_enabled == 1)
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "MQTT Broker 管理观测不可用，无法判断消息丢弃"}
            - alert: MQTTDeliveryLoss
              expr: (delta(mqtt_broker_dropped[5m]) > 0) or (delta(mqtt_inbox_rejected[5m]) > 0) or (mqtt_inbox_corrupt > 0)
              for: 0m
              labels: {severity: critical}
              annotations: {summary: "MQTT 消息出现丢弃、拒收或持久队列损坏"}
            - alert: MQTTInboxBacklog
              expr: mqtt_inbox_pending > 10000
              for: 2m
              labels: {severity: warning}
              annotations: {summary: "MQTT 持久队列积压超过一万条"}
        - name: infrastructure
          rules:
            - alert: ScrapeTargetDown
              expr: up == 0
              for: 2m
              labels: {severity: warning}
              annotations: {summary: "采集目标 {{ $$labels.job }} / {{ $$labels.instance }} 不可用"}
  grafana-local-datasources:
    file: ./ops/grafana/provisioning/datasources/datasources.yml
  loki-local:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
        # Loki 在 info 级别为每次查询及其拆分的子查询写多行日志，这些日志又被 Alloy 采回 Loki，
        # 查询越多日志越多；只保留 warn 及以上。
        log_level: warn
      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      ruler:
        storage:
          type: local
          local:
            directory: /etc/loki/ops/rules
        rule_path: /loki/rules-temp
        alertmanager_url: http://alertmanager:9093
        enable_api: true
        poll_interval: 10s
        ring:
          kvstore:
            store: inmemory
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: ${LOKI_RETENTION:-168h}
      runtime_config:
        file: /etc/loki/ops/runtime.yaml
        period: 10s
  alloy-local:
    content: |
      // Alloy 自身只记录 warn 及以上，避免采集器日志占用日志量。
      logging {
        level = "warn"
      }

      discovery.docker "compose" {
        host = "unix:///var/run/docker.sock"
        filter {
          name   = "label"
          values = ["com.docker.compose.project=${COMPOSE_PROJECT_NAME:-iot-platform-local}"]
        }
      }

      discovery.relabel "compose" {
        targets = discovery.docker.compose.targets
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
      }

      loki.source.docker "compose" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.compose.output
        forward_to = [loki.process.levels.receiver]
      }

      loki.process "levels" {
        stage.regex {
          expression = "(?i)(?:\"level\"\\s*:\\s*\"|\\blevel=\"?)(?P<level>[a-z]+)"
        }
        stage.template {
          source   = "level"
          template = "{{ $$l := ToLower .Value }}{{ if or (eq $$l \"warn\") (eq $$l \"warning\") }}warn{{ else if or (eq $$l \"error\") (eq $$l \"err\") }}error{{ else if or (eq $$l \"fatal\") (eq $$l \"panic\") (eq $$l \"crit\") (eq $$l \"critical\") }}fatal{{ else if or (eq $$l \"debug\") (eq $$l \"trace\") }}debug{{ else if or (eq $$l \"info\") (eq $$l \"notice\") }}info{{ else }}unknown{{ end }}"
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
