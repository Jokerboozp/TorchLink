name: iot-platform-local

# Dependencies for host-side Go/Vite development. No platform-api/platform-web containers.
# scripts/setup-local.ps1 or scripts/setup-local.sh prepares .env.local and starts these services.
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [iot]

services:
  deepseek-harness:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:8091:8091"
    image: ${IOT_DEEPSEEK_HARNESS_IMAGE:-iot-deepseek-harness:local}
    build:
      context: .
      dockerfile: deploy/deepseek-harness/Dockerfile
    environment:
      IOT_HARNESS_HOST: 0.0.0.0
      IOT_HARNESS_PORT: "8091"
      IOT_HARNESS_GATEWAY_TOKEN: ${IOT_AI_HARNESS_TOKEN:-local-harness-gateway-token-change-me-now}
      IOT_HARNESS_SESSION_ROOT: /data/sessions
      IOT_HARNESS_HOME: /data/runtime-home
      IOT_HARNESS_WORKSPACE: /data/workspace
      IOT_HARNESS_PLUGIN_DIR: /data/plugins
      IOT_HARNESS_PLUGIN_SEED_DIR: /harness/examples/iot-ops-agent/plugins
      IOT_HARNESS_MCP_ALLOWED_ORIGINS: ${IOT_HARNESS_MCP_ALLOWED_ORIGINS:-http://host.docker.internal:8081}
      IOT_HARNESS_MAX_CONCURRENCY: ${IOT_HARNESS_MAX_CONCURRENCY:-2}
      IOT_HARNESS_MAX_CACHED_CONVERSATIONS: ${IOT_HARNESS_MAX_CACHED_CONVERSATIONS:-4}
      IOT_HARNESS_CONVERSATION_TTL_MS: ${IOT_HARNESS_CONVERSATION_TTL_MS:-600000}
      IOT_HARNESS_RUN_TIMEOUT_MS: ${IOT_HARNESS_RUN_TIMEOUT_MS:-85000}
      IOT_HARNESS_RPC_TIMEOUT_MS: ${IOT_HARNESS_RPC_TIMEOUT_MS:-80000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      IOT_HARNESS_PROVIDER: ${IOT_AI_HARNESS_PROVIDER:-deepseek-official}
      IOT_HARNESS_MODEL: ${IOT_AI_HARNESS_MODEL:-deepseek-flash}
    volumes: ["deepseek-harness-data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:15432:5432"
    image: postgres:17-alpine3.22
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=300s", "-c", "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f"]
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-iot-postgres-change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data", "postgres-wal:/wal-archive"]
    depends_on:
      postgres-wal-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-wal-init:
    image: alpine:3.22
    restart: "no"
    command: ["/bin/sh", "-ec", "chown -R 70:70 /wal-archive && chmod 750 /wal-archive"]
    volumes: ["postgres-wal:/wal-archive"]
    networks: [iot]

  redis:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:16379:6379"
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-iot-redis-change-me}"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local-iot-redis-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19000:9000"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19002:9001"
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iotadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-iot-minio-change-me}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-dr:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19001:9000"
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_DR_ROOT_USER:-iotdradmin}
      MINIO_ROOT_PASSWORD: ${MINIO_DR_ROOT_PASSWORD:-local-iot-minio-dr-change-me}
    volumes: ["minio-dr-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19092:19092"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19644:9644"
    image: redpandadata/redpanda:v25.2.11
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:19092", "--advertise-kafka-addr", "internal://redpanda:9092,external://${IOT_LOCAL_ADVERTISED_HOST:-127.0.0.1}:19092"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 15

  redpanda-init:
    image: redpandadata/redpanda:v25.2.11
    restart: "no"
    depends_on: {redpanda: {condition: service_healthy}}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in iot.raw.message iot.parse.failed iot.parsed.message iot.property.report iot.event.report iot.device.state iot.video.alarm iot.alarm.raised iot.alarm.reported iot.alarm.recovered iot.alarm.confirmed iot.alarm.ai-analysis iot.ui-action iot.replay.request; do
          rpk -X brokers=redpanda:9092 topic create "$$topic" --partitions 12 --replicas 1 || true
        done
    networks: [iot]

  clickhouse:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18123:8123"
    image: clickhouse/clickhouse-server:25.7-alpine
    environment:
      CLICKHOUSE_DB: iot
      CLICKHOUSE_USER: iot
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-iot-clickhouse-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user iot --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15

  emqx:
    <<: *service-defaults
    # MQTT ingress is ready only after its downstream Kafka topics exist.
    # A completion dependency also lets Compose --wait accept the init job's exit.
    depends_on:
      redpanda-init: {condition: service_completed_successfully}
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:1883:1883"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:8083:8083"
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18083:18083"
    image: emqx/emqx:5.8.8
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        jwt_secret_b64="$$(printf '%s' "$$IOT_JWT_SECRET" | base64 | tr -d '\n')"
        printf 'authentication = [{mechanism = jwt, from = password, algorithm = "hmac-based", use_jwks = false, secret = "%s", secret_base64_encoded = true, acl_claim_name = "acl", verify_claims = [{name = "username", value = "$${username}"}], disconnect_after_expire = true}]\n' "$$jwt_secret_b64" > /opt/emqx/etc/base.hocon
        sed -i 's/{allow, all}\./{deny, all}./' /opt/emqx/etc/acl.conf
        exec /usr/bin/docker-entrypoint.sh /opt/emqx/bin/emqx foreground
    environment:
      EMQX_NAME: iot-emqx
      # Optional Erlang JIT compatibility flags for x86 emulation; native hosts use defaults.
      ERL_FLAGS: ${IOT_EMQX_ERL_FLAGS:-}
      IOT_JWT_SECRET: ${IOT_JWT_SECRET:?IOT_JWT_SECRET must be set}
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: ignore
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public-change-me}
    volumes: ["emqx-data:/opt/emqx/data", "emqx-log:/opt/emqx/log"]
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 15

  backup-service:
    <<: *service-defaults
    # 本地默认不启动备份容器；源码调试请在 VS Code 启动 backup-service。
    # 需要临时用容器运行时再显式加 --profile backup。
    profiles: [backup]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:8092:8090"
    restart: unless-stopped
    image: ${IOT_BACKUP_IMAGE:-iot-platform-backup:local}
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26-alpine AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /out/backup-service ./cmd/backup-service
        FROM alpine:3.22
        RUN apk add --no-cache ca-certificates tzdata
        COPY --from=build /out/backup-service /usr/local/bin/backup-service
        ENTRYPOINT ["backup-service"]
    environment:
      IOT_BACKUP_HTTP_ADDR: :8090
      IOT_BACKUP_DIR: /app/data/backups
      IOT_POSTGRES_DSN: postgres://iot:${POSTGRES_PASSWORD:-local-iot-postgres-change-me}@postgres:5432/iot?sslmode=disable
      IOT_MINIO_ENDPOINT: minio:9000
      IOT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-iotadmin}
      IOT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-iot-minio-change-me}
      IOT_CLICKHOUSE_URL: http://iot:${CLICKHOUSE_PASSWORD:-local-iot-clickhouse-change-me}@clickhouse:8123?database=iot
      IOT_BACKUP_ENABLED: ${IOT_BACKUP_ENABLED:-true}
      IOT_BACKUP_TIME: ${IOT_BACKUP_TIME:-00:05}
      IOT_BACKUP_TIMEZONE: ${IOT_BACKUP_TIMEZONE:-Asia/Shanghai}
      IOT_BACKUP_ADMIN_TOKEN: ${IOT_BACKUP_ADMIN_TOKEN:-change-me-backup-admin-token}
    volumes:
      - backup-staging:/app/data/backups
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  ollama:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:11434:11434"
    image: ollama/ollama:0.11.4
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes: ["ollama-data:/root/.ollama"]

  weaviate:
    <<: *service-defaults
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:18080:8080"
    image: cr.weaviate.io/semitechnologies/weaviate:1.32.8
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: text2vec-ollama
      ENABLE_MODULES: text2vec-ollama,backup-filesystem
      OLLAMA_APIENDPOINT: http://ollama:11434
      BACKUP_FILESYSTEM_PATH: /var/lib/weaviate/backups
      CLUSTER_HOSTNAME: node1
    volumes: ["weaviate-data:/var/lib/weaviate"]
    depends_on:
      ollama: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/v1/.well-known/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # 运维中心依赖（可选）：scripts/setup-local 使用 --include-ops / -IncludeOps 启用 ops profile。
  # 源码模式的 API 在宿主机运行，规则与通知配置目录通过绑定挂载共享给组件。
  prometheus:
    <<: *service-defaults
    profiles: [ops]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}", "--enable-feature=auto-reload-config", "--config.auto-reload-interval=5s"]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19090:9090"
    configs:
      - {source: prometheus-local, target: /etc/prometheus/prometheus.yml}
      - {source: prometheus-local-alerts, target: /etc/prometheus/alerts.yml}
    volumes: ["prometheus-data:/prometheus", "${IOT_LOCAL_OPS_DIR:-./data/ops}/prometheus-rules:/etc/prometheus/rules:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    <<: *service-defaults
    profiles: [ops]
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:13100:3100"
    configs:
      - {source: loki-local, target: /etc/loki/local-config.yaml}
    volumes: ["loki-data:/loki", "${IOT_LOCAL_OPS_DIR:-./data/ops}/loki:/etc/loki/ops:ro"]

  grafana:
    <<: *service-defaults
    profiles: [ops]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:13000:3000"
    configs:
      - {source: grafana-local-datasources, target: /etc/grafana/provisioning/datasources/iot.yml}
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}

  alertmanager:
    <<: *service-defaults
    profiles: [ops]
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/ops/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    ports:
      - "${IOT_LOCAL_BIND_ADDRESS:-127.0.0.1}:19093:9093"
    volumes: ["${IOT_LOCAL_OPS_DIR:-./data/ops}/alertmanager:/etc/alertmanager/ops:ro", "alertmanager-data:/alertmanager"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    <<: *service-defaults
    profiles: [ops]
    image: grafana/alloy:v1.20.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    configs:
      - {source: alloy-local, target: /etc/alloy/config.alloy}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro", "alloy-data:/var/lib/alloy/data"]
    depends_on:
      loki: {condition: service_started}

  node-exporter:
    <<: *service-defaults
    profiles: [ops]
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro"]

networks:
  iot:
    driver: bridge

volumes:
  postgres-data: {}
  postgres-wal: {}
  redis-data: {}
  minio-data: {}
  minio-dr-data: {}
  redpanda-data: {}
  clickhouse-data: {}
  emqx-data: {}
  emqx-log: {}
  backup-staging: {}
  ollama-data: {}
  weaviate-data: {}
  deepseek-harness-data: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
  alertmanager-data: {}
  alloy-data: {}

configs:
  prometheus-local:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/alerts.yml
        - /etc/prometheus/rules/*.yml
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]
      scrape_configs:
        - job_name: iot-platform
          metrics_path: /metrics
          static_configs:
            - targets: ["${IOT_LOCAL_API_HOST:-host.docker.internal}:8081"]
        - job_name: backup-service
          metrics_path: /metrics
          static_configs:
            - targets: ["${IOT_LOCAL_API_HOST:-host.docker.internal}:8092"]
        - job_name: redpanda
          metrics_path: /public_metrics
          static_configs:
            - targets: ["redpanda:9644"]
        - job_name: emqx
          metrics_path: /api/v5/prometheus/stats
          static_configs:
            - targets: ["emqx:18083"]
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: loki
          static_configs:
            - targets: ["loki:3100"]
        - job_name: alertmanager
          static_configs:
            - targets: ["alertmanager:9093"]
        - job_name: grafana
          static_configs:
            - targets: ["grafana:3000"]
        - job_name: alloy
          static_configs:
            - targets: ["alloy:12345"]
  prometheus-local-alerts:
    content: |
      groups:
        - name: infrastructure
          rules:
            - alert: ScrapeTargetDown
              expr: up == 0
              for: 2m
              labels: {severity: warning}
              annotations: {summary: "采集目标 {{ $$labels.job }} / {{ $$labels.instance }} 不可用"}
  grafana-local-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
  loki-local:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      ruler:
        storage:
          type: local
          local:
            directory: /etc/loki/ops/rules
        rule_path: /loki/rules-temp
        alertmanager_url: http://alertmanager:9093
        enable_api: true
        poll_interval: 10s
        ring:
          kvstore:
            store: inmemory
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: ${LOKI_RETENTION:-168h}
      runtime_config:
        file: /etc/loki/ops/runtime.yaml
        period: 10s
  alloy-local:
    content: |
      discovery.docker "compose" {
        host = "unix:///var/run/docker.sock"
        filter {
          name   = "label"
          values = ["com.docker.compose.project=${COMPOSE_PROJECT_NAME:-iot-platform-local}"]
        }
      }

      discovery.relabel "compose" {
        targets = discovery.docker.compose.targets
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
      }

      loki.source.docker "compose" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.compose.output
        forward_to = [loki.process.levels.receiver]
      }

      loki.process "levels" {
        stage.regex {
          expression = "(?i)(?:\"level\"\\s*:\\s*\"|\\blevel=\"?)(?P<level>[a-z]+)"
        }
        stage.template {
          source   = "level"
          template = "{{ $$l := ToLower .Value }}{{ if or (eq $$l \"warn\") (eq $$l \"warning\") }}warn{{ else if or (eq $$l \"error\") (eq $$l \"err\") }}error{{ else if or (eq $$l \"fatal\") (eq $$l \"panic\") (eq $$l \"crit\") (eq $$l \"critical\") }}fatal{{ else if or (eq $$l \"debug\") (eq $$l \"trace\") }}debug{{ else if or (eq $$l \"info\") (eq $$l \"notice\") }}info{{ else }}unknown{{ end }}"
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
